name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  vet-test:
    name: Vet & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]   # Linux 目标架构
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: go build ./...

  build-darwin:
    name: Build Darwin (${{ matrix.arch }})
    runs-on: macos-26      # 使用 macOS runner
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]          # 如需 amd64 可添加，但 Apple Silicon 现以 arm64 为主
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Build
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
        run: go build ./...